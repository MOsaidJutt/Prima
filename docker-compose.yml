version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prima
      POSTGRES_PASSWORD: prima
      POSTGRES_DB: prima
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prima']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prima-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
